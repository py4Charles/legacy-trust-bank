databases:
  - name: legacy-trust-bank-db
    databaseName: ltb
    user: ltb
    plan: free

services:
  - type: web
    name: legacy-trust-bank-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    # Migrations run on startup via the Dockerfile CMD (`prisma migrate deploy`),
    # which is the only option on the Free instance type. After upgrading to a
    # paid plan, uncomment the line below and drop the migrate step from the
    # Dockerfile CMD so migrations run once per deploy on a separate instance.
    # preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: legacy-trust-bank-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
