services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ltb
      POSTGRES_PASSWORD: ltb
      POSTGRES_DB: ltb
    ports:
      - "5432:5432"
    volumes:
      - ltb-postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltb -d ltb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ltb-postgres:
