services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ltb
      POSTGRES_PASSWORD: ltb
      POSTGRES_DB: ltb
    ports:
      - "5433:5432"
    volumes:
      - ltb-postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltb -d ltb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ltb:ltb@db:5432/ltb?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${omhe8GTJZYzWrBmuDBdNsGHn0IxvVP71ByK8CQmgjuW9VRC_MEDM1qes1Q23Rg8l}
      JWT_REFRESH_SECRET: ${Ui1ys3rW4GJLRXfeKY6WTgnLJpVrbXNVxs9jyDoYqY5pWX7edPeqkGLyIUSf0cvM}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      TWO_FACTOR_ENABLED: ${TWO_FACTOR_ENABLED:-true}
    ports:
      - "4001:4000"

volumes:
  ltb-postgres:
